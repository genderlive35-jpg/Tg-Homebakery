<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Магазин</title>

  <style>
    body {
      margin: 0;
      padding: 0 0 90px;
      font-family: Arial, sans-serif;
      background: #10141c;
      color: white;
    }

    header {
      padding: 25px 18px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: #9ca6b5;
      margin-top: 6px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .product {
      background: #1b2230;
      border-radius: 18px;
      overflow: hidden;
    }

    .product img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #293140;
    }

    .product-info {
      padding: 13px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px;
      background: #3390ec;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .full {
      width: 100%;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px 20px;
      color: #9ca6b5;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #1b2230;
    }

    nav button {
      flex: 1;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍 Мой магазин</h1>
  <div class="subtitle">Выберите товар</div>
</header>

<div id="products"></div>

<nav>
  <button onclick="loadProducts()">🛍 Каталог</button>
  <button onclick="showCart()">🛒 Корзина</button>
</nav>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

let cart = [];

async function loadProducts() {

  const box = document.getElementById("products");

  try {

    const response = await fetch("/api/products");
    const products = await response.json();

    if (products.length === 0) {
      box.innerHTML =
        '<div class="empty">' +
        '<h2>Пока нет товаров</h2>' +
        '<p>Товары появятся здесь после добавления через админ-панель.</p>' +
        '</div>';

      return;
    }

    box.innerHTML = products.map(product => `

      <div class="product">

        ${
          product.image
          ? `<img src="${product.image}">`
          : `<div style="height:150px;background:#293140"></div>`
        }

        <div class="product-info">

          <b>${product.name}</b>

          <div class="price">
            ${product.price} ₽
          </div>

          <p>
            ${product.description || ""}
          </p>

          <button
            class="full"
            onclick='addToCart(${JSON.stringify(product)})'>
            🛒 В корзину
          </button>

        </div>
      </div>

    `).join("");

  } catch (error) {

    box.innerHTML =
      '<div class="empty">Ошибка загрузки магазина</div>';

  }
}

function addToCart(product) {

  cart.push(product);

  tg.HapticFeedback?.impactOccurred("light");

  alert("Товар добавлен в корзину");
}

function showCart() {

  const box = document.getElementById("products");

  if (cart.length === 0) {

    box.innerHTML =
      '<div class="empty"><h2>Корзина пуста</h2></div>';

    return;
  }

  let total = cart.reduce(
    (sum, product) => sum + product.price,
    0
  );

  box.innerHTML = `

    <div style="
      grid-column:1/-1;
      padding:15px;
    ">

      <h2>🛒 Корзина</h2>

      ${cart.map(product => `
        <div class="product" style="margin-bottom:10px">
          <div class="product-info">
            <b>${product.name}</b>
            <div>${product.price} ₽</div>
          </div>
        </div>
      `).join("")}

      <h2>Итого: ${total} ₽</h2>

    </div>
  `;
}

loadProducts();
</script>

</body>
</html>
