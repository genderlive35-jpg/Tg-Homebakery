<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Home Bakery</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 0;

    font-family:
        Arial,
        sans-serif;

    background:
        #10151f;

    color:
        white;

}


.header {

    position: sticky;

    top: 0;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 16px 18px;

    background:
        #10151f;

    border-bottom:
        1px solid #293140;

}


.logo {

    font-size:
        22px;

    font-weight:
        bold;

}


.cart-button {

    width: auto;

    margin: 0;

    padding:
        10px 14px;

    border-radius:
        14px;

}


.container {

    max-width:
        720px;

    margin:
        0 auto;

    padding:
        18px;

}


.tabs {

    display: flex;

    gap: 10px;

    margin-bottom:
        20px;

}


.tab {

    flex: 1;

    background:
        #1b2230;

}


.tab.active {

    background:
        #3390ec;

}


.product {

    background:
        #1b2230;

    padding:
        16px;

    border-radius:
        18px;

    margin-bottom:
        15px;

}


.product img {

    width:
        100%;

    max-height:
        300px;

    object-fit:
        cover;

    border-radius:
        14px;

    margin-bottom:
        10px;

}


.product h2 {

    margin:
        5px 0 8px;

}


.price {

    display:
        block;

    margin-top:
        12px;

    font-size:
        21px;

    font-weight:
        bold;

}


button {

    width:
        100%;

    padding:
        13px;

    border:
        none;

    border-radius:
        12px;

    background:
        #3390ec;

    color:
        white;

    font-size:
        16px;

    font-weight:
        bold;

    margin-top:
        10px;

    cursor:
        pointer;

}


button:disabled {

    opacity:
        0.5;

}


.cart-item {

    background:
        #1b2230;

    padding:
        14px;

    border-radius:
        14px;

    margin-bottom:
        10px;

}


.cart-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

}


.remove {

    width:
        auto;

    background:
        #b43b3b;

    padding:
        8px 12px;

    margin:
        0;

}


.total {

    font-size:
        24px;

    font-weight:
        bold;

    margin:
        20px 0;

}


.payment {

    background:
        #1b2230;

    border-radius:
        18px;

    padding:
        18px;

    margin-top:
        18px;

}


.phone {

    background:
        #10151f;

    padding:
        14px;

    border-radius:
        12px;

    font-size:
        22px;

    font-weight:
        bold;

    text-align:
        center;

    margin:
        12px 0;

}


.order-code {

    background:
        #10151f;

    padding:
        14px;

    border-radius:
        12px;

    margin:
        12px 0;

}


.muted {

    color:
        #9ca6b5;

}


.success {

    color:
        #70df8a;

}


.error {

    color:
        #ff8585;

}


.hidden {

    display:
        none;

}


.empty {

    text-align:
        center;

    padding:
        40px 10px;

    color:
        #9ca6b5;

}

</style>

</head>


<body>


<div class="header">

    <div class="logo">
        🧁 Home Bakery
    </div>


    <button
        class="cart-button"
        onclick="showCart()"
    >

        🛒 Корзина
        <span id="cartCount">
            0
        </span>

    </button>

</div>


<div class="container">


<div class="tabs">

    <button
        id="catalogTab"
        class="tab active"
        onclick="showCatalog()"
    >
        🧁 Каталог
    </button>


    <button
        id="cartTab"
        class="tab"
        onclick="showCart()"
    >
        🛒 Корзина
    </button>

</div>


<!-- ======================
КАТАЛОГ
====================== -->


<section id="catalogPage">


<h1>
    Каталог
</h1>


<p class="muted">
    Выберите то, что хотите заказать
</p>


<div id="products">

    Загрузка…

</div>


</section>


<!-- ======================
КОРЗИНА
====================== -->


<section
    id="cartPage"
    class="hidden"
>


<h1>
    🛒 Корзина
</h1>


<div id="cartItems">

    Корзина пуста

</div>


<div
    id="checkout"
    class="hidden"
>


<div
    id="total"
    class="total"
>

    Итого: 0 ₽

</div>


<div class="payment">


<h2>
    💳 Оплата
</h2>


<p>
    Переведите итоговую сумму
    по номеру телефона:
</p>


<div class="phone">

    +7 923 600-20-40

</div>


<p class="muted">

    Банк: Сбербанк

</p>


<button
    onclick="copyPhone()"
>

    📋 Скопировать номер

</button>


<div class="order-code">


<b>
    Ваш номер заказа:
</b>


<div
    id="orderId"
    style="
        font-size:20px;
        margin-top:8px;
    "
>
</div>


</div>


<p class="muted">

    После перевода нажмите кнопку ниже.

    Администратор проверит поступление денег.

</p>


<button
    id="paidButton"
    onclick="paymentDone()"
>

    ✅ Я оплатил(а)

</button>


<p id="result"></p>


</div>


</div>


</section>


</div>


<script>


const tg =
    window.Telegram?.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

}


let basket = [];


/*
Сохраняем корзину,
чтобы она не исчезала,
если пользователь переключил страницу.
*/

try {

    basket =
        JSON.parse(
            localStorage.getItem(
                "homebakery_cart"
            )
            ||
            "[]"
        );

} catch {

    basket = [];

}


/*
Создаём номер заказа.
*/

let orderId =
    localStorage.getItem(
        "homebakery_order_id"
    );


if (!orderId) {

    orderId =
        "HB-"
        +
        Date.now()
            .toString()
            .slice(-8);

    localStorage.setItem(
        "homebakery_order_id",
        orderId
    );

}


document.getElementById(
    "orderId"
).textContent =
    orderId;


/*
Получаем покупателя из Telegram.
*/

function getBuyer() {


    const user =
        tg?.initDataUnsafe
        ?.user;


    if (!user) {

        return {

            id:
                null,

            first_name:
                "",

            last_name:
                "",

            username:
                ""

        };

    }


    return {

        id:
            user.id || null,

        first_name:
            user.first_name || "",

        last_name:
            user.last_name || "",

        username:
            user.username || ""

    };

}


/*
Сохранение корзины.
*/

function saveCart() {

    localStorage.setItem(
        "homebakery_cart",
        JSON.stringify(
            basket
        )
    );


    updateCartCount();

}


/*
Количество товаров.
*/

function updateCartCount() {

    document.getElementById(
        "cartCount"
    ).textContent =
        basket.length;

}


/*
Каталог.
*/

function showCatalog() {


    document.getElementById(
        "catalogPage"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "cartPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "catalogTab"
    ).classList.add(
        "active"
    );


    document.getElementById(
        "cartTab"
    ).classList.remove(
        "active"
    );

}


/*
Корзина.
*/

function showCart() {


    document.getElementById(
        "catalogPage"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "cartPage"
    ).classList.remove(
        "hidden"
    );


    document.getElementById(
        "catalogTab"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "cartTab"
    ).classList.add(
        "active"
    );


    drawCart();

}


/*
Загрузка каталога.
*/

async function loadProducts() {


    const container =
        document.getElementById(
            "products"
        );


    try {


        const response =
            await fetch(
                "/api/products"
            );


        const products =
            await response.json();


        container.innerHTML =
            "";


        if (!products.length) {

            container.innerHTML =
                '<div class="empty">Товаров пока нет</div>';

            return;

        }


        products.forEach(
            product => {


                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "product";


                let imageHtml =
                    "";


                if (product.image) {

                    imageHtml = `

                        <img
                            src="${product.image}"
                            alt=""
                        >

                    `;

                }


                element.innerHTML = `

                    ${imageHtml}

                    <h2>
                        ${product.name}
                    </h2>

                    <p class="muted">
                        ${product.description || ""}
                    </p>

                    <span class="price">
                        ${product.price} ₽
                    </span>

                    <button>
                        ➕ Добавить в корзину
                    </button>

                `;


                element
                    .querySelector(
                        "button"
                    )
                    .onclick =
                    function() {


                        basket.push(
                            product
                        );


                        saveCart();


                        if (tg) {

                            tg.HapticFeedback
                                ?.impactOccurred(
                                    "light"
                                );

                        }

                    };


                container.appendChild(
                    element
                );

            }
        );


    } catch (error) {


        container.innerHTML =
            '<div class="error">❌ Не удалось загрузить каталог</div>';


    }

}


/*
Отображение корзины.
*/

function drawCart() {


    const container =
        document.getElementById(
            "cartItems"
        );


    const checkout =
        document.getElementById(
            "checkout"
        );


    if (!basket.length) {


        container.innerHTML =
            '<div class="empty">🛒 Корзина пока пуста</div>';


        checkout.classList.add(
            "hidden"
        );


        updateCartCount();

        return;

    }


    checkout.classList.remove(
        "hidden"
    );


    container.innerHTML =
        "";


    basket.forEach(
        (
            item,
            index
        ) => {


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "cart-item";


            element.innerHTML = `

                <div class="cart-row">

                    <div>

                        <b>
                            ${item.name}
                        </b>

                        <br>

                        <span class="muted">
                            ${item.price} ₽
                        </span>

                    </div>


                    <button
                        class="remove"
                    >
                        ×
                    </button>

                </div>

            `;


            element
                .querySelector(
                    "button"
                )
                .onclick =
                function() {


                    basket.splice(
                        index,
                        1
                    );


                    saveCart();

                    drawCart();

                };


            container.appendChild(
                element
            );

        }
    );


    const total =
        basket.reduce(

            (
                sum,
                item
            ) =>

                sum
                +
                Number(
                    item.price
                ),

            0

        );


    document.getElementById(
        "total"
    ).textContent =
        "Итого: "
        +
        total
        +
        " ₽";


    updateCartCount();

}


/*
Копирование телефона.
*/

async function copyPhone() {


    const phone =
        "+79236002040";


    try {


        await navigator.clipboard
            .writeText(
                phone
            );


        if (tg) {

            tg.showAlert(
                "Номер телефона скопирован"
            );

        } else {

            alert(
                "Номер телефона скопирован"
            );

        }


    } catch {


        if (tg) {

            tg.showAlert(
                phone
            );

        } else {

            alert(
                phone
            );

        }

    }

}


/*
Нажатие "Я оплатил(а)".
*/

async function paymentDone() {


    const result =
        document.getElementById(
            "result"
        );


    const button =
        document.getElementById(
            "paidButton"
        );


    if (!basket.length) {

        return;

    }


    const buyer =
        getBuyer();


    if (!buyer.id) {


        result.className =
            "error";


        result.textContent =
            "❌ Откройте магазин через кнопку внутри Telegram-бота.";


        return;

    }


    const total =
        basket.reduce(

            (
                sum,
                item
            ) =>

                sum
                +
                Number(
                    item.price
                ),

            0

        );


    button.disabled =
        true;


    result.className =
        "";


    result.textContent =
        "⏳ Отправляем информацию об оплате…";


    try {


        const response =
            await fetch(

                "/api/payment-done",

                {

                    method:
                        "POST",


                    headers: {

                        "Content-Type":
                            "application/json"

                    },


                    body:
                        JSON.stringify({

                            cart:
                                basket,

                            total:
                                total,

                            buyer:
                                buyer,

                            order_id:
                                orderId

                        })

                }

            );


        let data = {};


        try {

            data =
                await response.json();

        } catch {}


        if (!response.ok) {


            throw new Error(

                data.error
                ||
                (
                    "Ошибка "
                    +
                    response.status
                )

            );

        }


        result.className =
            "success";


        result.textContent =
            "✅ Спасибо! Информация об оплате отправлена продавцу. Ожидайте подтверждения.";


        /*
        После успешной отправки
        очищаем корзину.
        */

        basket = [];


        saveCart();


        /*
        Следующему заказу
        будет присвоен новый номер.
        */

        localStorage.removeItem(
            "homebakery_order_id"
        );


        drawCart();


    } catch (error) {


        result.className =
            "error";


        result.textContent =
            "❌ "
            +
            error.message;


        button.disabled =
            false;

    }

}


/*
Запуск.
*/

updateCartCount();

loadProducts();

showCatalog();


</script>


</body>

</html>
