<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>
    Home Bakery
</title>


<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

body {

    margin: 0;

    padding: 20px;

    font-family:
        Arial,
        sans-serif;

    background:
        #10151f;

    color:
        white;

}


.product,
.cart {

    background:
        #1b2230;

    padding:
        16px;

    border-radius:
        16px;

    margin:
        12px 0;

}


img {

    width:
        100%;

    border-radius:
        12px;

    max-height:
        280px;

    object-fit:
        cover;

}


button {

    width:
        100%;

    padding:
        13px;

    border:
        none;

    border-radius:
        11px;

    background:
        #3390ec;

    color:
        white;

    font-size:
        16px;

    font-weight:
        bold;

    margin-top:
        8px;

}


button:disabled {

    opacity:
        0.5;

}


.muted {

    color:
        #9ca6b5;

}


.success {

    color:
        #70df8a;

}


.error {

    color:
        #ff8585;

}


.remove {

    width:
        auto;

    padding:
        4px 10px;

    margin-left:
        8px;

    background:
        #b43b3b;

}

</style>

</head>


<body>


<h1>
    🧁 Home Bakery
</h1>


<p class="muted">
    Выберите товары
</p>


<div id="products">

    Загрузка…

</div>


<div class="cart">


<h2>
    🛒 Корзина
</h2>


<div id="cart">

    Корзина пуста

</div>


<h3 id="total">

    Итого: 0 ₽

</h3>


<button
    id="pay"
    disabled
>

    Я оплатил(а) — уведомить продавца

</button>


<p
    id="result"
></p>


</div>


<script>


const tg =
    window.Telegram?.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

}


let basket = [];


/*
Получаем данные покупателя
непосредственно из Telegram WebApp.
*/

function getBuyer() {


    const user =
        tg?.initDataUnsafe
        ?.user;


    if (!user) {

        return {

            id:
                null,

            first_name:
                "",

            last_name:
                "",

            username:
                ""

        };

    }


    return {

        id:
            user.id || null,

        first_name:
            user.first_name || "",

        last_name:
            user.last_name || "",

        username:
            user.username || ""

    };

}


/*
Загрузка товаров
*/

async function loadProducts() {


    const container =
        document.getElementById(
            "products"
        );


    try {


        const response =
            await fetch(
                "/api/products"
            );


        const products =
            await response.json();


        container.innerHTML =
            products.length
                ? ""
                : "Товаров пока нет";


        products.forEach(
            product => {


                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "product";


                let imageHtml =
                    "";


                if (product.image) {

                    imageHtml = `

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                    `;

                }


                element.innerHTML = `

                    ${imageHtml}

                    <h2>
                        ${product.name}
                    </h2>

                    <p>
                        ${product.description || ""}
                    </p>

                    <b>
                        ${product.price} ₽
                    </b>

                    <button>
                        Добавить в корзину
                    </button>

                `;


                element
                    .querySelector(
                        "button"
                    )
                    .onclick =
                    function() {


                        basket.push(
                            product
                        );


                        drawCart();

                    };


                container.appendChild(
                    element
                );

            }
        );


    } catch (error) {


        container.textContent =
            "❌ Ошибка загрузки товаров";


    }

}


/*
Отображение корзины
*/

function drawCart() {


    const cart =
        document.getElementById(
            "cart"
        );


    const total =
        basket.reduce(
            (
                sum,
                item
            ) =>
                sum
                +
                Number(
                    item.price
                ),
            0
        );


    if (!basket.length) {


        cart.innerHTML =
            "Корзина пуста";


    } else {


        cart.innerHTML =
            basket.map(

                (
                    item,
                    index
                ) => `

                    <div>

                        ${item.name}

                        —

                        ${item.price} ₽

                        <button
                            class="remove"
                            onclick="removeItem(${index})"
                        >

                            ×

                        </button>

                    </div>

                `

            ).join("");

    }


    document.getElementById(
        "total"
    ).textContent =
        "Итого: "
        +
        total
        +
        " ₽";


    document.getElementById(
        "pay"
    ).disabled =
        !basket.length;

}


/*
Удаление товара
из корзины
*/

window.removeItem =
function(index) {


    basket.splice(
        index,
        1
    );


    drawCart();

};


/*
Покупатель нажимает
"Я оплатил(а)"
*/

document.getElementById(
    "pay"
).onclick =
async function() {


    const button =
        document.getElementById(
            "pay"
        );


    const result =
        document.getElementById(
            "result"
        );


    if (!basket.length) {

        return;

    }


    const buyer =
        getBuyer();


    /*
    Очень важно:

    Покупатель должен открыть
    магазин именно внутри Telegram.

    Иначе Telegram не даст
    ID и username.
    */

    if (!buyer.id) {


        result.className =
            "error";


        result.textContent =
            "❌ Не удалось получить данные Telegram. Откройте магазин через кнопку внутри бота.";


        return;

    }


    const total =
        basket.reduce(

            (
                sum,
                item
            ) =>
                sum
                +
                Number(
                    item.price
                ),

            0

        );


    button.disabled =
        true;


    result.className =
        "";


    result.textContent =
        "⏳ Отправляем информацию об оплате…";


    try {


        const response =
            await fetch(

                "/api/payment-done",

                {

                    method:
                        "POST",


                    headers: {

                        "Content-Type":
                            "application/json"

                    },


                    body:
                        JSON.stringify({

                            cart:
                                basket,

                            total:
                                total,

                            buyer:
                                buyer

                        })

                }

            );


        let data = {};


        try {

            data =
                await response.json();

        } catch (error) {}


        if (!response.ok) {


            throw new Error(

                data.error
                ||
                (
                    "Ошибка "
                    +
                    response.status
                )

            );

        }


        result.className =
            "success";


        result.textContent =
            "✅ Спасибо! Информация об оплате отправлена продавцу. Ожидайте подтверждения.";


        basket = [];


        drawCart();


    } catch (error) {


        result.className =
            "error";


        result.textContent =
            "❌ "
            +
            error.message;


        button.disabled =
            false;

    }

};


loadProducts();


</script>


</body>

</html>
