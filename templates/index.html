<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Home Bakery</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #10151f;
    color: white;
}

.product,
.cart {
    background: #1b2230;
    padding: 16px;
    border-radius: 16px;
    margin: 12px 0;
}

img {
    width: 100%;
    border-radius: 12px;
    max-height: 280px;
    object-fit: cover;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 11px;
    background: #3390ec;
    color: white;
    font-weight: bold;
    margin-top: 8px;
}

.muted {
    color: #9ca6b5;
}

</style>

</head>

<body>

<h1>🧁 Home Bakery</h1>

<p class="muted">
    Выберите товары
</p>

<div id="products">
    Загрузка…
</div>


<div class="cart">

<h2>🛒 Корзина</h2>

<div id="cart">
    Корзина пуста
</div>

<h3 id="total">
    Итого: 0 ₽
</h3>

<button
    id="pay"
    disabled
>
    Я оплатил(а) — уведомить продавца
</button>

<p id="result"></p>

</div>


<script>

const tg = window.Telegram?.WebApp;

tg?.ready();
tg?.expand();


let basket = [];


async function loadProducts() {

    const response =
        await fetch("/api/products");

    const products =
        await response.json();

    const container =
        document.getElementById("products");

    container.innerHTML =
        products.length
            ? ""
            : "Товаров пока нет";


    products.forEach(product => {

        const element =
            document.createElement("div");

        element.className =
            "product";


        element.innerHTML = `

            ${
                product.image
                    ? `<img src="${product.image}">`
                    : ""
            }

            <h2>
                ${product.name}
            </h2>

            <p>
                ${product.description || ""}
            </p>

            <b>
                ${product.price} ₽
            </b>

            <button>
                Добавить в корзину
            </button>
        `;


        element
            .querySelector("button")
            .onclick = () => {

                basket.push(product);

                drawCart();
            };


        container.appendChild(
            element
        );

    });

}


function drawCart() {

    const cart =
        document.getElementById("cart");

    const total =
        basket.reduce(
            (sum, item) =>
                sum + Number(item.price),
            0
        );


    if (!basket.length) {

        cart.innerHTML =
            "Корзина пуста";

    } else {

        cart.innerHTML =
            basket.map(
                (item, index) => `

                    ${item.name}
                    —
                    ${item.price} ₽

                    <button
                        style="width:auto"
                        onclick="removeItem(${index})"
                    >
                        ×
                    </button>

                `
            ).join("<br>");

    }


    document.getElementById(
        "total"
    ).textContent =
        "Итого: " + total + " ₽";


    document.getElementById(
        "pay"
    ).disabled =
        !basket.length;

}


window.removeItem =
function(index) {

    basket.splice(
        index,
        1
    );

    drawCart();
};


document.getElementById(
    "pay"
).onclick =
async function() {

    const result =
        document.getElementById(
            "result"
        );


    const total =
        basket.reduce(
            (sum, item) =>
                sum + Number(item.price),
            0
        );


    result.textContent =
        "Отправляем…";


    try {

        const response =
            await fetch(
                "/api/payment-done",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            cart: basket,
                            total: total
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Ошибка " +
                response.status
            );

        }


        result.textContent =
            "✅ Продавец получил уведомление";


        basket = [];

        drawCart();


    } catch (error) {

        result.textContent =
            "❌ " + error.message;

    }

};


loadProducts();

</script>

</body>

</html>
