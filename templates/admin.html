<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>
    Админ-панель
</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #10151f;
    color: white;
}

.card {
    background: #1b2230;
    padding: 18px;
    border-radius: 18px;
    margin: 15px 0;
}

input,
textarea,
button {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin: 7px 0;
    border: none;
    border-radius: 11px;
    font-size: 16px;
}

textarea {
    min-height: 90px;
}

button {
    background: #3390ec;
    color: white;
    font-weight: bold;
}

.danger {
    background: #b43b3b;
}

.item {
    border-top: 1px solid #444;
    padding: 12px 0;
}

.muted {
    color: #9ca6b5;
}

</style>

</head>


<body>


<h1>
    ⚙️ Админ-панель
</h1>


<p
    id="me"
    class="muted"
>
    Проверяем Telegram ID…
</p>


<div class="card">

<h2>
    ➕ Добавить товар
</h2>


<input
    id="name"
    placeholder="Название товара"
>


<input
    id="price"
    type="number"
    placeholder="Цена ₽"
>


<textarea
    id="description"
    placeholder="Описание товара"
></textarea>


<input
    id="image"
    placeholder="Ссылка на фотографию"
>


<button
    onclick="addProduct()"
>
    ➕ Добавить товар
</button>


<p id="productResult"></p>


</div>


<div class="card">

<h2>
    📦 Товары
</h2>

<div id="products">
    Загрузка…
</div>

</div>


<div
    class="card"
    id="adminBox"
    style="display:none"
>

<h2>
    👥 Администраторы
</h2>


<input
    id="newAdminId"
    type="number"
    placeholder="Telegram ID нового администратора"
>


<button
    onclick="addAdmin()"
>
    ➕ Добавить администратора
</button>


<p id="adminResult"></p>


<div id="admins"></div>


</div>


<script>

const tg =
    window.Telegram?.WebApp;


tg?.ready();
tg?.expand();


function getUserId() {

    const id =
        tg?.initDataUnsafe
        ?.user
        ?.id;

    return id
        ? String(id)
        : "";

}


function headers() {

    return {

        "Content-Type":
            "application/json",

        "X-Telegram-User-Id":
            getUserId()

    };

}


async function parseResponse(
    response
) {

    let data = {};

    try {

        data =
            await response.json();

    } catch (error) {}


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Ошибка " +
            response.status
        );

    }


    return data;

}


async function checkMe() {

    const info =
        document.getElementById(
            "me"
        );


    if (!getUserId()) {

        info.textContent =
            "❌ Откройте админ-панель кнопкой внутри Telegram-бота";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/me",
                {
                    headers:
                        headers()
                }
            );


        const data =
            await parseResponse(
                response
            );


        info.textContent =
            "Telegram ID: " +
            data.id +
            (
                data.owner
                    ? " • 👑 Владелец"
                    : data.admin
                    ? " • Администратор"
                    : " • Нет прав"
            );


        if (data.owner) {

            document.getElementById(
                "adminBox"
            ).style.display =
                "block";

            loadAdmins();

        }


    } catch (error) {

        info.textContent =
            "❌ " +
            error.message;

    }

}


async function addProduct() {

    const result =
        document.getElementById(
            "productResult"
        );


    const product = {

        name:
            document.getElementById(
                "name"
            ).value.trim(),

        price:
            document.getElementById(
                "price"
            ).value,

        description:
            document.getElementById(
                "description"
            ).value.trim(),

        image:
            document.getElementById(
                "image"
            ).value.trim()

    };


    if (!product.name) {

        result.textContent =
            "❌ Введите название";

        return;

    }


    if (!product.price) {

        result.textContent =
            "❌ Введите цену";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/products",
                {

                    method:
                        "POST",

                    headers:
                        headers(),

                    body:
                        JSON.stringify(
                            product
                        )

                }
            );


        await parseResponse(
            response
        );


        result.textContent =
            "✅ Товар добавлен";


        document.getElementById(
            "name"
        ).value = "";

        document.getElementById(
            "price"
        ).value = "";

        document.getElementById(
            "description"
        ).value = "";

        document.getElementById(
            "image"
        ).value = "";


        loadProducts();


    } catch (error) {

        result.textContent =
            "❌ " +
            error.message;

    }

}


async function loadProducts() {

    const container =
        document.getElementById(
            "products"
        );


    try {

        const response =
            await fetch(
                "/api/products"
            );


        const products =
            await response.json();


        container.innerHTML =
            products.length
                ? ""
                : "Товаров пока нет";


        products.forEach(
            product => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "item";


                element.innerHTML = `

                    <b>
                        ${product.name}
                    </b>

                    —
                    ${product.price} ₽

                    <br>

                    ${product.description || ""}

                    <button
                        class="danger"
                    >
                        🗑 Удалить
                    </button>
                `;


                element
                    .querySelector(
                        "button"
                    )
                    .onclick =
                    async () => {

                        try {

                            const response =
                                await fetch(
                                    "/api/products/" +
                                    product.id,
                                    {

                                        method:
                                            "DELETE",

                                        headers:
                                            headers()

                                    }
                                );


                            await parseResponse(
                                response
                            );


                            loadProducts();


                        } catch (error) {

                            alert(
                                error.message
                            );

                        }

                    };


                container.appendChild(
                    element
                );

            }
        );


    } catch (error) {

        container.textContent =
            "❌ " +
            error.message;

    }

}


async function addAdmin() {

    const result =
        document.getElementById(
            "adminResult"
        );


    const telegramId =
        document.getElementById(
            "newAdminId"
        ).value.trim();


    if (!telegramId) {

        result.textContent =
            "❌ Введите Telegram ID";

        return;

    }


    try {

        const response =
            await fetch(
                "/api/admins",
                {

                    method:
                        "POST",

                    headers:
                        headers(),

                    body:
                        JSON.stringify({
                            telegram_id:
                                telegramId
                        })

                }
            );


        await parseResponse(
            response
        );


        result.textContent =
            "✅ Администратор добавлен";


        document.getElementById(
            "newAdminId"
        ).value = "";


        loadAdmins();


    } catch (error) {

        result.textContent =
            "❌ " +
            error.message;

    }

}


async function loadAdmins() {

    const container =
        document.getElementById(
            "admins"
        );


    try {

        const response =
            await fetch(
                "/api/admins",
                {
                    headers:
                        headers()
                }
            );


        const admins =
            await parseResponse(
                response
            );


        container.innerHTML =
            "";


        admins.forEach(
            admin => {

                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "item";


                element.textContent =
                    admin.telegram_id +
                    (
                        admin.owner
                            ? " 👑 Владелец"
                            : ""
                    );


                if (!admin.owner) {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.className =
                        "danger";


                    button.textContent =
                        "Удалить администратора";


                    button.onclick =
                    async () => {

                        try {

                            const response =
                                await fetch(
                                    "/api/admins/" +
                                    admin.telegram_id,
                                    {

                                        method:
                                            "DELETE",

                                        headers:
                                            headers()

                                    }
                                );


                            await parseResponse(
                                response
                            );


                            loadAdmins();


                        } catch (error) {

                            alert(
                                error.message
                            );

                        }

                    };


                    element.appendChild(
                        button
                    );

                }


                container.appendChild(
                    element
                );

            }
        );


    } catch (error) {

        container.textContent =
            "❌ " +
            error.message;

    }

}


checkMe();
loadProducts();

</script>


</body>

</html>
