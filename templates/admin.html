<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>

    <!-- Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #10151f;
            color: white;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #9ca6b5;
            margin-bottom: 25px;
        }

        .card {
            background: #1b2230;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 15px;
        }

        input, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        textarea {
            min-height: 90px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #3390ec;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .result {
            margin-top: 12px;
        }
    </style>
</head>

<body>

<h1>⚙️ Админ-панель</h1>
<div class="subtitle">Управление магазином</div>

<div class="card">
    <h2>➕ Добавить товар</h2>

    <input id="name" placeholder="Название товара">

    <input
        id="price"
        type="number"
        min="0"
        step="0.01"
        placeholder="Цена ₽"
    >

    <textarea
        id="description"
        placeholder="Описание товара"
    ></textarea>

    <input
        id="image"
        placeholder="Ссылка на фотографию (необязательно)"
    >

    <button id="addProductButton" type="button">
        ➕ Добавить товар
    </button>

    <p id="productResult" class="result"></p>
</div>


<div class="card">
    <h2>👥 Администраторы</h2>

    <input
        id="newAdminId"
        type="number"
        placeholder="Telegram ID нового администратора"
    >

    <button id="addAdminButton" type="button">
        ➕ Добавить администратора
    </button>

    <p id="adminResult" class="result"></p>
</div>


<script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    function getTelegramUserId() {
        return tg?.initDataUnsafe?.user?.id || null;
    }


    async function addProduct() {
        const button = document.getElementById("addProductButton");
        const result = document.getElementById("productResult");

        const name =
            document.getElementById("name").value.trim();

        const price =
            document.getElementById("price").value.trim();

        const description =
            document.getElementById("description").value.trim();

        const image =
            document.getElementById("image").value.trim();

        if (!name || !price) {
            result.textContent =
                "❌ Введите название товара и цену";
            return;
        }

        const userId = getTelegramUserId();

        if (!userId) {
            result.textContent =
                "❌ Telegram ID не получен. Откройте админ-панель кнопкой внутри Telegram-бота.";
            return;
        }

        button.disabled = true;
        result.textContent = "⏳ Добавляем товар...";

        try {
            const response = await fetch("/api/products", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-Telegram-User-Id": String(userId)
                },

                body: JSON.stringify({
                    name: name,
                    price: Number(price),
                    description: description,
                    image: image
                })
            });

            let data = {};

            try {
                data = await response.json();
            } catch (e) {}

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Ошибка сервера " + response.status
                );
            }

            result.textContent = "✅ Товар добавлен!";

            document.getElementById("name").value = "";
            document.getElementById("price").value = "";
            document.getElementById("description").value = "";
            document.getElementById("image").value = "";

        } catch (error) {
            result.textContent =
                "❌ " + error.message;

        } finally {
            button.disabled = false;
        }
    }


    async function addAdmin() {
        const button =
            document.getElementById("addAdminButton");

        const input =
            document.getElementById("newAdminId");

        const result =
            document.getElementById("adminResult");

        const telegramId = input.value.trim();

        if (!telegramId) {
            result.textContent =
                "❌ Введите Telegram ID";
            return;
        }

        const userId = getTelegramUserId();

        if (!userId) {
            result.textContent =
                "❌ Telegram ID владельца не получен. Откройте панель через Telegram-бота.";
            return;
        }

        button.disabled = true;
        result.textContent =
            "⏳ Добавляем администратора...";

        try {
            const response = await fetch("/api/admins", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "X-Telegram-User-Id": String(userId)
                },

                body: JSON.stringify({
                    telegram_id: Number(telegramId)
                })
            });

            let data = {};

            try {
                data = await response.json();
            } catch (e) {}

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Ошибка сервера " + response.status
                );
            }

            result.textContent =
                "✅ Администратор добавлен";

            input.value = "";

        } catch (error) {
            result.textContent =
                "❌ " + error.message;

        } finally {
            button.disabled = false;
        }
    }


    document
        .getElementById("addProductButton")
        .addEventListener("click", addProduct);

    document
        .getElementById("addAdminButton")
        .addEventListener("click", addAdmin);
</script>

</body>
</html>
